<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Dashboard — Crafts of Pakistan</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@450;600;700&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#E7D9B8; --card:#F6EFDD; --ink:#2B2015; --ink-soft:#5B4B37;
    --palm:#3E5233; --clay:#A6512B; --gold:#B6842F; --line:#CBB988; --white:#FFFBF2;
    --font-display:'Fraunces',serif; --font-body:'Karla',sans-serif; --font-mono:'JetBrains Mono',monospace;
    --radius:16px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--sand); color:var(--ink); font-family:var(--font-body); }
  h1,h2{ font-family:var(--font-display); margin:0; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 24px; }

  /* login */
  #loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:36px; max-width:380px; width:100%; }
  .login-card h1{ font-size:26px; margin-bottom:8px; }
  .login-card p{ color:var(--ink-soft); font-size:14px; margin-bottom:24px; }
  input{ width:100%; padding:12px 14px; border:1.3px solid var(--ink); border-radius:10px; font-family:var(--font-body); font-size:16px; margin-bottom:14px; background:var(--white); }
  button{ font-family:inherit; cursor:pointer; }
  .btn{ width:100%; padding:13px; border-radius:10px; border:none; background:var(--clay); color:var(--white); font-weight:700; font-size:14.5px; }
  .btn:hover{ background:var(--ink); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  #loginError{ color:#8a2d1a; font-size:13px; margin-top:12px; display:none; }

  /* dashboard */
  #dashboard{ display:none; }
  header{ background:var(--ink); color:var(--sand); padding:20px 0; }
  header .wrap{ display:flex; justify-content:space-between; align-items:center; }
  header h1{ color:var(--white); font-size:22px; }
  #logoutBtn{ background:transparent; border:1px solid var(--sand); color:var(--sand); padding:8px 16px; border-radius:8px; font-size:13px; }
  #logoutBtn:hover{ background:var(--sand); color:var(--ink); }

  .stats{ display:flex; gap:16px; padding:24px; flex-wrap:wrap; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; flex:1; min-width:140px; }
  .stat .num{ font-family:var(--font-display); font-size:28px; }
  .stat .label{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-top:4px; }

  .filters{ display:flex; gap:10px; padding:0 24px 16px; flex-wrap:wrap; }
  .filter-pill{ font-family:var(--font-mono); font-size:12px; border:1.3px solid var(--ink); background:transparent; padding:8px 14px; border-radius:20px; cursor:pointer; }
  .filter-pill.active{ background:var(--ink); color:var(--white); }

  .orders{ padding:0 24px 60px; display:flex; flex-direction:column; gap:14px; }
  .order-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
  .order-top .name{ font-family:var(--font-display); font-size:19px; }
  .order-top .date{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft); }
  .badges{ display:flex; gap:8px; flex-wrap:wrap; }
  .badge{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:5px 10px; border-radius:20px; }
  .badge-paid{ background:#dfe9d8; color:var(--palm); }
  .badge-pending{ background:#f3e3c8; color:var(--gold); }
  .badge-failed{ background:#f4d9cf; color:#8a2d1a; }
  .order-detail{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:12px; }
  .order-detail strong{ color:var(--ink); }
  .items-list{ font-size:13px; margin:10px 0; padding-left:0; list-style:none; }
  .items-list li{ padding:4px 0; border-bottom:1px dashed var(--line); }
  .order-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .toggle-btn{ font-family:var(--font-mono); font-size:12px; border:1.3px solid var(--ink); background:var(--white); padding:9px 16px; border-radius:8px; }
  .toggle-btn.is-complete{ background:var(--palm); color:var(--white); border-color:var(--palm); }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:var(--font-mono); font-size:13.5px; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Order Dashboard</h1>
    <p>Sign in to view and manage orders for Crafts of Pakistan.</p>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn" id="loginBtn">Sign in</button>
    <p id="loginError"></p>
  </div>
</div>

<div id="dashboard">
  <header>
    <div class="wrap">
      <h1>Crafts of Pakistan — Orders</h1>
      <button id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats" id="statsRow"></div>
    <div class="filters" id="filterRow"></div>
    <div class="orders" id="ordersList"></div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ===================== CONFIG ===================== */
const SUPABASE_URL = "https://imdxhiyvnkmsjgmzmkgq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_O8jiHptPH7BBSFXZ6CigBA_YwVoFtXO";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById("loginScreen");
const dashboard = document.getElementById("dashboard");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

/* ===================== AUTH ===================== */
async function checkSession(){
  const { data: { session } } = await supabase.auth.getSession();
  if (session){
    loginScreen.style.display = "none";
    dashboard.style.display = "block";
    loadOrders();
  } else {
    loginScreen.style.display = "flex";
    dashboard.style.display = "none";
  }
}

loginBtn.addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in…";
  loginError.style.display = "none";

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  loginBtn.disabled = false;
  loginBtn.textContent = "Sign in";
  if (error){
    loginError.textContent = "Couldn't sign in — check your email and password.";
    loginError.style.display = "block";
    return;
  }
  checkSession();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  checkSession();
});

/* ===================== ORDERS ===================== */
let allOrders = [];
let activeFilter = "all";

function fmtPrice(n){ return "PKR " + Number(n).toLocaleString("en-PK"); }
function fmtDate(iso){
  return new Date(iso).toLocaleString("en-PK", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
}

async function loadOrders(){
  const { data, error } = await supabase
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error){
    document.getElementById("ordersList").innerHTML = `<div class="empty">Couldn't load orders: ${error.message}</div>`;
    return;
  }
  allOrders = data || [];
  drawStats();
  drawFilters();
  drawOrders();
}

function drawStats(){
  const total = allOrders.length;
  const paid = allOrders.filter(o => o.payment_status === "paid").length;
  const incomplete = allOrders.filter(o => o.order_status === "incomplete" && o.payment_status === "paid").length;
  const revenue = allOrders.filter(o => o.payment_status === "paid").reduce((s,o) => s + Number(o.total_amount), 0);

  document.getElementById("statsRow").innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">Total orders</div></div>
    <div class="stat"><div class="num">${paid}</div><div class="label">Paid</div></div>
    <div class="stat"><div class="num">${incomplete}</div><div class="label">Awaiting fulfillment</div></div>
    <div class="stat"><div class="num">${fmtPrice(revenue)}</div><div class="label">Revenue collected</div></div>
  `;
}

function drawFilters(){
  const filters = [
    { id: "all", label: "All" },
    { id: "paid_incomplete", label: "Paid — Incomplete" },
    { id: "paid_completed", label: "Paid — Completed" },
    { id: "pending", label: "Payment pending" },
    { id: "failed", label: "Payment failed" },
  ];
  document.getElementById("filterRow").innerHTML = filters.map(f =>
    `<button class="filter-pill ${activeFilter === f.id ? 'active' : ''}" data-filter="${f.id}">${f.label}</button>`
  ).join("");
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => { activeFilter = btn.dataset.filter; drawFilters(); drawOrders(); });
  });
}

function drawOrders(){
  let filtered = allOrders;
  if (activeFilter === "paid_incomplete") filtered = allOrders.filter(o => o.payment_status === "paid" && o.order_status === "incomplete");
  if (activeFilter === "paid_completed") filtered = allOrders.filter(o => o.payment_status === "paid" && o.order_status === "completed");
  if (activeFilter === "pending") filtered = allOrders.filter(o => o.payment_status === "pending");
  if (activeFilter === "failed") filtered = allOrders.filter(o => o.payment_status === "failed");

  const list = document.getElementById("ordersList");
  if (!filtered.length){
    list.innerHTML = `<div class="empty">No orders in this view yet.</div>`;
    return;
  }

  list.innerHTML = filtered.map(o => `
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="name">${o.customer_name}</div>
          <div class="date">${fmtDate(o.created_at)}</div>
        </div>
        <div class="badges">
          <span class="badge badge-${o.payment_status === 'paid' ? 'paid' : (o.payment_status === 'failed' ? 'failed' : 'pending')}">${o.payment_status}</span>
        </div>
      </div>
      <div class="order-detail">
        <strong>Phone:</strong> ${o.customer_phone} &nbsp;·&nbsp; <strong>Email:</strong> ${o.customer_email}<br>
        <strong>Address:</strong> ${o.customer_address}
      </div>
      <ul class="items-list">
        ${(o.items || []).map(i => `<li>${i.name} × ${i.qty} — ${fmtPrice(i.price * i.qty)}</li>`).join("")}
      </ul>
      <div class="order-detail"><strong>Total: ${fmtPrice(o.total_amount)}</strong></div>
      <div class="order-actions">
        <button class="toggle-btn ${o.order_status === 'completed' ? 'is-complete' : ''}" data-toggle="${o.id}" data-status="${o.order_status}">
          ${o.order_status === "completed" ? "✓ Completed" : "Mark as Completed"}
        </button>
      </div>
    </div>
  `).join("");

  document.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.toggle;
      const newStatus = btn.dataset.status === "completed" ? "incomplete" : "completed";
      btn.disabled = true;
      const { error } = await supabase.from("orders").update({ order_status: newStatus }).eq("id", id);
      btn.disabled = false;
      if (!error) loadOrders();
    });
  });
}

checkSession();
</script>
</body>
</html>
